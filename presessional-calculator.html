<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UofG Pre‑Sessional Course Start Calculator</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --ink:#0e1726; --muted:#4a5568; --uofg:#005f83;
  }
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#fff;margin:0;padding:40px 16px;}
  .wrap{max-width:980px;margin:0 auto;}
  .card{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.25);padding:24px;}
  h1{margin:.2em 0 .4em;font-size:1.6rem;color:var(--card)}
  h2{margin:0 0 12px;font-size:1.25rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  label{font-weight:600;font-size:.95rem}
  select,input{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:10px;font-size:1rem}
  button{background:var(--uofg);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:18px}
  button:hover{background:#024b66}
  .result{margin-top:20px;padding:16px;border-left:4px solid var(--uofg);background:#f8fafc;border-radius:8px}
  .muted{color:var(--muted);font-size:.9rem}
  .foot{margin-top:14px;font-size:.85rem;color:#334155}
  code.small{background:#f1f5f9;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h2>1) Choose your target IELTS requirement</h2>
    <select id="target">
      <option value="60-overall">IELTS 6.0 overall</option>
      <option value="65-overall">IELTS 6.5 overall</option>
      <option value="65-overall-writing-conds">IELTS 6.5 overall (writing rule)</option>
      <option value="65-every">IELTS 6.5 in every skill</option>
      <option value="70-overall">IELTS 7.0 overall</option>
      <option value="70-every">IELTS 7.0 in every skill</option>
    </select>

    <h2 style="margin-top:18px;">2) Enter your current IELTS scores</h2>
    <div class="grid">
      <div><label for="L">Listening</label><input id="L" type="number" step="0.5" min="0" max="9"></div>
      <div><label for="R">Reading</label><input id="R" type="number" step="0.5" min="0" max="9"></div>
      <div><label for="W">Writing</label><input id="W" type="number" step="0.5" min="0" max="9"></div>
      <div><label for="S">Speaking</label><input id="S" type="number" step="0.5" min="0" max="9"></div>
    </div>

    <button id="go">Check Start Date</button>
    <div id="result" class="result" style="display:none"></div>

    <div class="foot">
      <strong>Notes</strong>: Overall rounding follows IELTS (.25→next .5; .75→next whole). Course dates/fees are for in‑person entries only (online option intentionally omitted here).
    </div>
  </div>
</div>

<script>
/* -------------------------------------------------------
   IELTS OVERALL ROUNDING (as requested)
   .25 → next .5 ; .75 → next whole band
------------------------------------------------------- */
function roundIeltsOverall(avg){
  const eps = 1e-9;
  const base = Math.floor(avg);
  const frac = avg - base;
  const near = (a,b)=>Math.abs(a-b)<0.001+eps;
  if(near(frac,0.25)) return base + 0.5;
  if(near(frac,0.75)) return base + 1.0;
  return Math.round(avg*2)/2;
}
function overallFrom(L,R,W,S){
  return roundIeltsOverall((L+R+W+S)/4);
}

/* -------------------------------------------------------
   Small utils
------------------------------------------------------- */
const allAtLeast   = (arr,n)=>arr.every(v=>v>=n);
const noneBelow    = (arr,n)=>arr.every(v=>v>=n);
const countEq      = (arr,n)=>arr.filter(v=>v===n).length;
const countAtLeast = (arr,n)=>arr.filter(v=>v>=n).length;

/* -------------------------------------------------------
   COURSE INFO (2026 in-person) – source: Course Dates/Fees page
------------------------------------------------------- */
const COURSE_INFO = {
  "January Entry":  { start:"9 Jan 2026",  end:"28 Aug 2026", deadline:"5 Dec 2025",  registration:"19 Dec 2025", fee:"£14,300" },
  "February Entry": { start:"13 Feb 2026", end:"28 Aug 2026", deadline:"9 Jan 2026",  registration:"26 Jan 2026", fee:"£12,100" },
  "April Entry":    { start:"27 Mar 2026", end:"28 Aug 2026", deadline:"13 Feb 2026", registration:"9 Mar 2026",  fee:"£9,900"  },
  "May Entry":      { start:"1 May 2026",  end:"28 Aug 2026", deadline:"20 Mar 2026", registration:"13 Apr 2026", fee:"£7,700"  },
  "June Entry":     { start:"15 Jun 2026", end:"28 Aug 2026", deadline:"1 May 2026",  registration:"25 May 2026", fee:"£5,500"  },
  "July Entry":     { start:"27 Jul 2026", end:"28 Aug 2026", deadline:"12 Jun 2026", registration:"6 Jul 2026",  fee:"£2,750"  }
};

/* -------------------------------------------------------
   RULESETS rebuilt from the official 2026 tables

   SOURCES:
   - 6.0 overall:                  /ifyouneedtoreachielts60overall/        (UofG EAS)
   - 6.5 overall (+2 skills 6.5):  /ifyouneedtoreachielts65overall/        (UofG EAS)
   - 6.5 overall (writing rules):  /ifyouneedtoreachielts65overallwriting65nosubtestlessthan60orwriting60allothersubtestsat65/ (UofG EAS)
   - 6.5 in every skill:           /ifyouneedtoreachielts65ineveryskill/   (UofG EAS)
   - 7.0 overall:                  /ifyouneedtoreachielts70overall/        (UofG EAS)
   - 7.0 in every skill:           /ifyouneedtoreachielts70ineveryskill/   (UofG EAS)

   Implementation notes:
   - We order tests from JULY → JANUARY so users land on the *shortest* course
     that satisfies the table (mirrors the site’s guidance).
   - “No more than one skill at X” = countEq([L,R,W,S], X) <= 1.
   - Where a branch mentions a specific Writing score, we apply that to W and,
     where appropriate, interpret “at least one/two skill(s) at Y” on [L,R,S].
------------------------------------------------------- */
const RULES = {
  /* --------------------------- Target: IELTS 6.0 overall --------------------------- */
  "60-overall":[
    // July: Overall 6.0, Writing 6.0, none below 5.5
    { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"July Entry" },

    // June: 5.5 or higher in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"June Entry" },

    // May: Overall 5.5, Writing 5.5, none below 5.0
    { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"May Entry" },

    // April: 5.0 or higher in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"April Entry" },

    // February: Overall 5.0, Writing 5.0, none below 4.5
    { test:({L,R,W,S,O})=>O>=5.0 && W>=5.0 && noneBelow([L,R,W,S],4.5), result:"February Entry" },

    // January: 4.5 in all skills or higher
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],4.5), result:"January Entry" }
  ],

  /* ---- Target: IELTS 6.5 overall (also covers '6.5 with ≥2 skills at 6.5, none <6.0') ---- */
  "65-overall":[
    // July: Overall 6.0 with no skill below 5.5
    { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],5.5), result:"July Entry" },

    // June: Minimum 5.5 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"June Entry" },

    // May: Overall 5.5, W≥5.5, and no more than one skill at 5.0 (none below 5.0)
    { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0) && countEq([L,R,W,S],5.0)<=1, result:"May Entry" },

    // April: Overall 5.5 AND (W≥5.5 & none below 5.0  OR  W=5.0 & [L,R,S]≥5.5)
    { test:({L,R,W,S,O})=>O>=5.5 && (
        (W>=5.5 && noneBelow([L,R,W,S],5.0)) ||
        (W===5.0 && allAtLeast([L,R,S],5.5))
      ), result:"April Entry" },

    // February: 5.0 or higher in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"February Entry" },

    // January: Overall 5.0, Writing 5.0, none below 4.5
    { test:({L,R,W,S,O})=>O>=5.0 && W>=5.0 && noneBelow([L,R,W,S],4.5), result:"January Entry" }
  ],

  /* ------------- Target: IELTS 6.5 overall with writing condition (two branches) ------------- */
  "65-overall-writing-conds":[
    // July: Overall 6.5 AND (W≥6.5 & ≤1 skill at 5.5  OR  W=6.0 & ≥2 of [L,R,S] at 6.5 & [L,R,S]≥6.0)
    { test:({L,R,W,S,O})=>O>=6.5 && (
        (W>=6.5 && countEq([L,R,W,S],5.5)<=1) ||
        (W===6.0 && countAtLeast([L,R,S],6.5)>=2 && noneBelow([L,R,S],6.0))
      ), result:"July Entry" },

    // June: Overall 6.0 AND (W≥6.0 & only one skill at 5.5  OR  W=5.5 & ≥1 of [L,R,S] at 6.5 & [L,R,S]≥6.0)
    { test:({L,R,W,S,O})=>O>=6.0 && (
        (W>=6.0 && countEq([L,R,W,S],5.5)===1) ||
        (W===5.5 && countAtLeast([L,R,S],6.5)>=1 && noneBelow([L,R,S],6.0))
      ), result:"June Entry" },

    // May: Overall 5.5, W≥5.5, and (no skill below 5.5  OR  ≥1 of [L,R,S] at 6.0 & ≤1 skill at 5.0)
    { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && (
        noneBelow([L,R,W,S],5.5) ||
        (countAtLeast([L,R,S],6.0)>=1 && countEq([L,R,W,S],5.0)<=1)
      ), result:"May Entry" },

    // April: Overall 5.5 AND (W≥5.5 & ≤1 skill at 5.0  OR  W=5.0 & ≥1 of [L,R,S] at 6.0 & [L,R,S]≥5.5)
    { test:({L,R,W,S,O})=>O>=5.5 && (
        (W>=5.5 && countEq([L,R,W,S],5.0)<=1) ||
        (W===5.0 && countAtLeast([L,R,S],6.0)>=1 && noneBelow([L,R,S],5.5))
      ), result:"April Entry" },

    // February: 5.0 or higher in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"February Entry" },

    // January: Overall ≥5.0, none below 4.5, and (W≥5.0 & ≤1 at 4.5  OR  W=4.5 & ≥1 of [L,R,S] at 5.5 & [L,R,S]≥5.0)
    { test:({L,R,W,S,O})=>O>=5.0 && noneBelow([L,R,W,S],4.5) && (
        (W>=5.0 && countEq([L,R,W,S],4.5)<=1) ||
        (W===4.5 && countAtLeast([L,R,S],5.5)>=1 && noneBelow([L,R,S],5.0))
      ), result:"January Entry" }
  ],

  /* --------------------------- Target: IELTS 6.5 in every skill --------------------------- */
  "65-every":[
    // July: Overall 6.5, W≥6.5, and ≤1 skill at 6.0
    { test:({L,R,W,S,O})=>O>=6.5 && W>=6.5 && countEq([L,R,W,S],6.0)<=1, result:"July Entry" },

    // June: 6.0 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.0), result:"June Entry" },

    // May: Overall 6.0, W≥6.0, none below 5.5
    { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"May Entry" },

    // April: 5.5 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"April Entry" },

    // February: Overall 5.5, W≥5.5, none below 5.0
    { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"February Entry" },

    // January: 5.0 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"January Entry" }
  ],

  /* --------------------------- Target: IELTS 7.0 overall --------------------------- */
  "70-overall":[
    // July: 6.5 to 7.0 in all skills (i.e., all ≥6.5)
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.5), result:"July Entry" },

    // June: Overall 6.5, W≥6.5, none below 6.0
    { test:({L,R,W,S,O})=>O>=6.5 && W>=6.5 && noneBelow([L,R,W,S],6.0), result:"June Entry" },

    // May: 6.0 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.0), result:"May Entry" },

    // April: Overall 6.0, W≥6.0, none below 5.5
    { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"April Entry" },

    // February: 5.5 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"February Entry" },

    // January: Overall 5.5, W≥5.5, none below 5.0
    { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"January Entry" }
  ],

  /* --------------------------- Target: IELTS 7.0 in every skill --------------------------- */
  "70-every":[
    // July: Overall 7.0, W≥7.0, none below 6.5
    { test:({L,R,W,S,O})=>O>=7.0 && W>=7.0 && noneBelow([L,R,W,S],6.5), result:"July Entry" },

    // June: 6.5 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.5), result:"June Entry" },

    // May: Overall 6.5, W≥6.5, none below 6.0
    { test:({L,R,W,S,O})=>O>=6.5 && W>=6.5 && noneBelow([L,R,W,S],6.0), result:"May Entry" },

    // April: 6.0 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.0), result:"April Entry" },

    // February: Overall 6.0, W≥6.0, none below 5.5
    { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"February Entry" },

    // January: 5.5 in all skills
    { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"January Entry" }
  ]
};

/* -------------------------------------------------------
   UI Logic
------------------------------------------------------- */
const $ = id => document.getElementById(id);

$("go").addEventListener("click",()=>{
  const L = parseFloat($("L").value);
  const R = parseFloat($("R").value);
  const W = parseFloat($("W").value);
  const S = parseFloat($("S").value);

  if([L,R,W,S].some(v=>isNaN(v))){
    $("result").style.display="block";
    $("result").innerHTML="Please enter all four skills.";
    return;
  }

  // Basic sanity on range 0–9
  if([L,R,W,S].some(v=>v<0 || v>9)){
    $("result").style.display="block";
    $("result").innerHTML="Each IELTS subscore must be between 0.0 and 9.0.";
    return;
  }

  const O = overallFrom(L,R,W,S);
  const scores={L,R,W,S,O};
  const rules = RULES[$("target").value];
  const match = rules.find(r=>r.test(scores));

  $("result").style.display="block";

  if(match){
    const info = COURSE_INFO[match.result];
    $("result").innerHTML = `
      <strong>${match.result}</strong><br>
      <div class="muted">Computed overall: <code class="small">${O.toFixed(1)}</code></div>
      <br>
      <strong>Start date:</strong> ${info.start}<br>
      <strong>End date:</strong> ${info.end}<br>
      <strong>Application deadline:</strong> ${info.deadline}<br>
      <strong>Registration opens:</strong> ${info.registration}<br>
      <strong>Fees:</strong> ${info.fee}
    `;
  } else {
    $("result").innerHTML = `
      No exact match in official tables.<br>
      <span class="muted">Overall: ${O.toFixed(1)} — please contact EAS for guidance.</span>
    `;
  }
});
</script>

</body>
</html>
