<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UofG Pre‑Sessional Course Start Calculator</title>

<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --ink:#0e1726; --muted:#4a5568; --uofg:#005f83;
  }
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#fff;margin:0;padding:40px 16px;}
  .wrap{max-width:980px;margin:0 auto;}
  .card{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.25);padding:24px;}
  h2{margin:0 0 12px;font-size:1.25rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  label{font-weight:600;font-size:.95rem}
  select,input{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:10px;font-size:1rem}
  button{background:var(--uofg);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:18px}
  button:hover{background:#024b66}
  .result{margin-top:20px;padding:16px;border-left:4px solid var(--uofg);background:#f8fafc;border-radius:8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h2>1) Choose your target IELTS requirement</h2>
    <label for="target" class="sr-only">Target IELTS requirement</label>
    <select id="target" aria-label="Target IELTS requirement">
      <option value="60-overall">IELTS 6.0 overall</option>

      <option value="65-overall-nomin" selected>IELTS 6.5 overall (no subtest below 6.0)</option>
      <option value="65-overall-2x65">IELTS 6.5 overall (6.5 in 2 subtests, no subtest below 6.0)</option>

      <option value="65-writing-conds-65">IELTS 6.5 overall, writing at 6.5, no subtest less than 6.0</option>
      <option value="65-writing-conds-60">IELTS 6.5 overall, writing at 6.0, all other subtests at 6.5</option>

      <option value="65-every">IELTS 6.5 in all skills</option>

      <option value="70-overall">IELTS 7.0 overall</option>
      <option value="70-every">IELTS 7.0 in every skill</option>
    </select>

    <h2 style="margin-top:18px;">2) Enter your current IELTS scores</h2>
    <div class="grid">
      <div><label for="L">Listening</label><input id="L" type="number" step="0.5" min="0" max="9" inputmode="decimal"></div>
      <div><label for="R">Reading</label><input id="R" type="number" step="0.5" min="0" max="9" inputmode="decimal"></div>
      <div><label for="W">Writing</label><input id="W" type="number" step="0.5" min="0" max="9" inputmode="decimal"></div>
      <div><label for="S">Speaking</label><input id="S" type="number" step="0.5" min="0" max="9" inputmode="decimal"></div>
    </div>

    <button id="go">Check Start Date</button>

    <div id="result" class="result" style="display:none"></div>
  </div>
</div>

<script>

/* ---------- IELTS ROUNDING ---------- */
function roundIeltsOverall(avg){
  const eps = 1e-9;
  const base = Math.floor(avg);
  const frac = avg - base;
  const near = (a,b)=>Math.abs(a-b)<0.001+eps;
  if(near(frac,0.25)) return base + 0.5;
  if(near(frac,0.75)) return base + 1.0;
  return Math.round(avg*2)/2;
}
function overallFrom(L,R,W,S){
  return roundIeltsOverall((L+R+W+S)/4);
}

/* ---------- HELPERS ---------- */
const allAtLeast   = (arr,n)=>arr.every(v=>v>=n);
const noneBelow    = (arr,n)=>arr.every(v=>v>=n);
const countEq      = (arr,n)=>arr.filter(v=>v===n).length;
const countAtLeast = (arr,n)=>arr.filter(v=>v>=n).length;

/* ---------- COURSE INFO ---------- */
const COURSE_INFO = {
  "January Entry":  { start:"9 Jan 2026",  end:"28 Aug 2026", deadline:"12 Dec 2025",  registration:"19 Dec 2025", fee:"£14,300" },
  "February Entry": { start:"13 Feb 2026", end:"28 Aug 2026", deadline:"16 Jan 2026",  registration:"26 Jan 2026", fee:"£12,100" },
  "April Entry":    { start:"27 Mar 2026", end:"28 Aug 2026", deadline:"27 Feb 2026", registration:"9 Mar 2026",  fee:"£9,900"  },
  "May Entry":      { start:"1 May 2026",  end:"28 Aug 2026", deadline:"3 April 2026", registration:"13 Apr 2026", fee:"£7,700"  },
  "June Entry":     { start:"15 Jun 2026", end:"28 Aug 2026", deadline:"18 May 2026",  registration:"25 May 2026", fee:"£5,500"  },
  "July Entry":     { start:"27 Jul 2026", end:"28 Aug 2026", deadline:"26 Jun 2026", registration:"6 Jul 2026",  fee:"£2,750"  }
};

/* ---------- DISPLAY LABELS ---------- */
const DISPLAY_LABEL = {
  "January Entry":  "Module/Block 1 – January Entry",
  "February Entry": "Module/Block 2 – February Entry",
  "April Entry":    "Module/Block 3 – April Entry",
  "May Entry":      "Module/Block 4 – May Entry",
  "June Entry":     "Module/Block 5 – June Entry",
  "July Entry":     "Module/Block 6 – July Entry"
};

/* ---------- RULESETS ---------- */

/* 6.0 OVERALL — unchanged */
const RULES_60_OVERALL = [
  { test:({L,R,W,S,O})=>O>=6 && W>=6 && noneBelow([L,R,W,S],5.5), result:"July Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"June Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"May Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"April Entry" },
  { test:({L,R,W,S,O})=>O>=5.0 && W>=5.0 && noneBelow([L,R,W,S],4.5), result:"February Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],4.5), result:"January Entry" }
];

/* 6.5 OVERALL (NO SUBTEST < 6.0) — unchanged except June/July already correct */
const RULES_65_OVERALL_NOMIN = [
  { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],5.5), result:"July Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && noneBelow([L,R,W,S],5.5), result:"June Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0) && countEq([L,R,W,S],5.0)<=1, result:"May Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && ((W>=5.5 && noneBelow([L,R,W,S],5.0)) || (W===5.0 && allAtLeast([L,R,S],5.5))), result:"April Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"February Entry" },
  { test:({L,R,W,S,O})=>O>=5.0 && W>=5.0 && noneBelow([L,R,W,S],4.5), result:"January Entry" }
];

/* 6.5 OVERALL (2×6.5) — unchanged */
const RULES_65_OVERALL_2X65 = [
  { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],5.5), result:"July Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"June Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0) && countEq([L,R,W,S],5.0)<=1, result:"May Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && ((W>=5.5 && noneBelow([L,R,W,S],5.0)) || (W===5.0 && allAtLeast([L,R,S],5.5))), result:"April Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"February Entry" },
  { test:({L,R,W,S,O})=>O>=5.0 && W>=5.0 && noneBelow([L,R,W,S],4.5), result:"January Entry" }
];

/* 6.5 WRITING VARIANTS — unchanged */
const RULES_65_WRITING_UPDATED = [
  { test:({L,R,W,S,O}) =>
      (O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5)) ||
      (W===5.5 && countAtLeast([L,R,S],6.0)===3),
    result:"July Entry" },

  { test:({L,R,W,S,O}) =>
      (O>=5.5 && W>=6.0 && noneBelow([L,R,W,S],5.5)) ||
      (W===5.5 && countAtLeast([L,R,S],6.0)===3),
    result:"June Entry" },

  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && (
      noneBelow([L,R,W,S],5.5) ||
      (countAtLeast([L,R,S],6)>=1 && countEq([L,R,W,S],5.0)<=1)
    ), result:"May Entry" },

  { test:({L,R,W,S,O})=>O>=5.5 && (
      (W>=5.5 && countEq([L,R,W,S],5.0)<=1) ||
      (W===5.0 && countAtLeast([L,R,S],6)>=1 && noneBelow([L,R,S],5.5))
    ), result:"April Entry" },

  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"February Entry" },

  { test:({L,R,W,S,O})=>O>=5.0 && noneBelow([L,R,W,S],4.5) && (
      (W>=5.0 && countEq([L,R,W,S],4.5)<=1) ||
      (W===4.5 && countAtLeast([L,R,S],5.5)>=1 && noneBelow([L,R,S],5.0))
    ), result:"January Entry" }
];

/* FIXED 6.5 IN EVERY SKILL */
const RULES_65_EVERY = [
  { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],6.0), result:"July Entry" },
  { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],5.5), result:"June Entry" },  /* FIXED */
  { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"May Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"April Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"February Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.0), result:"January Entry" }
];

/*  FIXED 7.0 OVERALL */
const RULES_70_OVERALL = [
  { test:({L,R,W,S,O})=>O>=6.5 && noneBelow([L,R,W,S],6.0), result:"July Entry" },
  { test:({L,R,W,S,O})=>O>=6.0 && noneBelow([L,R,W,S],6.0), result:"June Entry" }, /* FIXED ORDER */
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.0), result:"May Entry" },
  { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"April Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"February Entry" },
  { test:({L,R,W,S,O})=>O>=5.5 && W>=5.5 && noneBelow([L,R,W,S],5.0), result:"January Entry" }
];

/*  FIXED 7.0 IN EVERY SKILL */
const RULES_70_EVERY = [
  { test:({L,R,W,S,O})=>O>=6.5 && noneBelow([L,R,W,S],6.5), result:"July Entry" },
  { test:({L,R,W,S,O})=>O>=6.5 && noneBelow([L,R,W,S],6.0), result:"June Entry" }, /* FIXED ORDER */
  { test:({L,R,W,S,O})=>O>=6.5 && W>=6.5 && noneBelow([L,R,W,S],6.0), result:"May Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],6.0), result:"April Entry" },
  { test:({L,R,W,S,O})=>O>=6.0 && W>=6.0 && noneBelow([L,R,W,S],5.5), result:"February Entry" },
  { test:({L,R,W,S})=>allAtLeast([L,R,W,S],5.5), result:"January Entry" }
];

/* ---------- RULE REGISTRY ---------- */
const RULES = {
  "60-overall": RULES_60_OVERALL,
  "65-overall-nomin": RULES_65_OVERALL_NOMIN,
  "65-overall-2x65": RULES_65_OVERALL_2X65,
  "65-writing-conds-65": RULES_65_WRITING_UPDATED,
  "65-writing-conds-60": RULES_65_WRITING_UPDATED,
  "65-every": RULES_65_EVERY,
  "70-overall": RULES_70_OVERALL,
  "70-every": RULES_70_EVERY
};

/* ---------- UI LOGIC ---------- */
const $ = id => document.getElementById(id);

$("go").addEventListener("click",()=>{
  const L = parseFloat($("L").value);
  const R = parseFloat($("R").value);
  const W = parseFloat($("W").value);
  const S = parseFloat($("S").value);

  const out = $("result");
  out.style.display = "block";

  if([L,R,W,S].some(v=>isNaN(v))){
    out.innerHTML = "Please enter all four skills.";
    return;
  }
  if([L,R,W,S].some(v=>v<0 || v>9)){
    out.innerHTML = "Each IELTS subscore must be between 0.0 and 9.0.";
    return;
  }

  const O = overallFrom(L,R,W,S);
  const scores={L,R,W,S,O};

  const sel = $("target").value;
  const rules = RULES[sel];
  const match = rules.find(r=>r.test(scores));

  if(match){
    const entryName = match.result;
    const label = DISPLAY_LABEL[entryName] || entryName;
    const info = COURSE_INFO[entryName];
    out.innerHTML = `
      <strong>${label}</strong><br>
      <strong>Start date:</strong> ${info.start}<br>
      <strong>End date:</strong> ${info.end}<br>
      <strong>Application deadline:</strong> ${info.deadline}<br>
      <strong>Registration opens:</strong> ${info.registration}<br>
      <strong>Fees:</strong> ${info.fee}
    `;
  } else {
    out.innerHTML = `
      <strong>No matching course found.</strong><br>
      Please contact EAS for advice.
    `;
  }
});
</script>

</body>
</html>
