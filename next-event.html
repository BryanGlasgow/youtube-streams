<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Next Livestream</title>

<!-- PT Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #ffffff;
  }

  .container {
    max-width: 640px; /* keep your current layout width */
    margin: 0 auto;
  }

  .stream {
    border: 1px solid #ddd;
    border-radius: 4px;
    overflow: hidden;
    background: #ffffff;
  }

  .stream img {
    width: 100%;
    display: block;
    /* keep a clean 16:9 frame and avoid letterboxing */
    aspect-ratio: 16 / 9;
    object-fit: cover;
    object-position: center;
  }

  .content {
    padding: 0.75rem;
  }

  .title {
    font-weight: bold;
    margin-bottom: 0.25rem;
  }

  .date {
    font-size: 0.9rem;
    color: #555;
  }

  .countdown {
    margin-top: 0.25rem;
    font-size: 0.95rem;
    font-weight: bold;
    color: #333;
  }

  .live {
    color: #cc0000;
  }

  .description {
    margin-top: 0.5rem;
    font-size: 0.9rem;
    color: #000000;
  }

  .calendar {
    margin-top: 0.5rem;
    font-size: 0.85rem;
  }

  .calendar a {
    margin-right: 0.75rem;
    text-decoration: none;
    color: #005398;
  }

  .calendar a:hover {
    text-decoration: underline;
  }

  .watch-live {
    margin-top: 0.75rem;
  }

  .watch-live a {
    display: inline-block;
    background: #cc0000;
    color: #fff;
    padding: 0.5rem 0.75rem;
    text-decoration: none;
    font-weight: bold;
    border-radius: 3px;
  }

  .watch-live a:hover {
    background: #a30000;
  }

  .none {
    font-style: italic;
    color: #666;
  }
</style>
</head>

<body>

<div class="container" id="output">
  Loading next livestream…
</div>

<script>
/* =======================
   CONFIG
======================= */
const API_KEY = "AIzaSyDvflaf2WrXoTPnj1-cDHYWhCD_pMJnhoY";
const CHANNEL_ID = "UC7Do00lxLh7l4WwXLl96P5A";
const TIMEZONE = "Europe/London";
const DESCRIPTION_LIMIT = 200;

/* DEV MODE (as requested) */
const TEST_MODE = false;

/* =======================
   UTILITIES
======================= */
function formatUKDate(iso) {
  return new Date(iso).toLocaleString("en-GB", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: TIMEZONE
  });
}

function truncate(text, max) {
  if (!text) return "";
  return text.length > max ? text.substring(0, max) + "…" : text;
}

function calendarLinks(title, startISO, videoId) {
  const start = new Date(startISO);
  const end = new Date(start.getTime() + 60 * 60 * 1000);

  const formatICS = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

  const ics = `
BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${formatICS(start)}
DTEND:${formatICS(end)}
SUMMARY:${title}
URL:https://www.youtube.com/watch?v=${videoId}
END:VEVENT
END:VCALENDAR
  `.trim();

  const icsBlob = new Blob([ics], { type: "text/calendar" });
  const icsUrl = URL.createObjectURL(icsBlob);

  const google =
    "https://www.google.com/calendar/render?action=TEMPLATE" +
    `&text=${encodeURIComponent(title)}` +
    `&dates=${formatICS(start)}/${formatICS(end)}` +
    `&details=${encodeURIComponent("Watch on YouTube")}` +
    `&location=${encodeURIComponent("YouTube")}`;

  return `
    <a href="${google}" target="_blank" rel="noopener">Add to Google Calendar</a>
    <a href="${icsUrl}" download="livestream.ics">Add to Outlook / Apple Calendar</a>
    <a href="https://www.youtube.com/channel/${CHANNEL_ID}?sub_confirmation=1" target="_blank" rel="noopener">Subscribe to YouTube Channel</a>
  `;
}

/* =======================
   COUNTDOWN / LIVE LOGIC
======================= */
function updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, isLive, hasEnded) {
  if (hasEnded) {
    countdownEl.textContent = "Stream ended";
    countdownEl.classList.remove("live");
    calendarEl.style.display = "none";
    watchLiveEl.style.display = "none";
    return;
  }

  if (isLive) {
    countdownEl.textContent = "LIVE NOW";
    countdownEl.classList.add("live");
    calendarEl.style.display = "none";
    watchLiveEl.style.display = "block";
    return;
  }

  const now = new Date();
  const start = new Date(startISO);
  const diff = start - now;

  if (diff <= 0) {
    // Not live yet (or API hasn't flipped), but past scheduled time
    countdownEl.textContent = "Starting…";
    countdownEl.classList.add("live");
    // Keep calendar visible until it truly flips to LIVE
    watchLiveEl.style.display = "none";
    return;
  }

  const mins = Math.floor(diff / 60000);
  const hrs = Math.floor(mins / 60);
  const days = Math.floor(hrs / 24);

  let text;
  if (days > 0) text = `Starts in ${days} day${days !== 1 ? "s" : ""}`;
  else if (hrs > 0) text = `Starts in ${hrs} hour${hrs !== 1 ? "s" : ""}`;
  else text = `Starts in ${mins} minute${mins !== 1 ? "s" : ""}`;

  countdownEl.textContent = text;
  countdownEl.classList.remove("live");
  calendarEl.style.display = "block";
  watchLiveEl.style.display = "none";
}

function startCountdown(startISO, countdownEl, calendarEl, watchLiveEl, stateRef) {
  // initial paint
  updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, stateRef.isLive, stateRef.hasEnded);

  // update every minute
  const id = setInterval(() => {
    updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, stateRef.isLive, stateRef.hasEnded);
    if (stateRef.hasEnded) clearInterval(id);
  }, 60_000);
}

/**
 * Lightweight polling to keep LIVE status accurate during the broadcast.
 * - Activates if we are within 15 minutes before start OR if live already.
 * - Polls every 60s and stops when the stream ends.
 */
function startLiveMonitor(videoId, stateRef, countdownEl, calendarEl, watchLiveEl, startISO) {
  const shouldMonitor = () => {
    if (stateRef.hasEnded) return false;
    if (stateRef.isLive) return true;
    const now = new Date();
    const start = new Date(startISO);
    const diff = start - now;
    return diff <= 15 * 60 * 1000; // begin monitoring within 15 mins of start
  };

  if (!shouldMonitor()) return;

  const poll = async () => {
    try {
      const url =
        "https://www.googleapis.com/youtube/v3/videos" +
        `?part=liveStreamingDetails` +
        `&id=${videoId}` +
        `&key=${API_KEY}`;

      const res = await fetch(url);
      if (!res.ok) return; // silent fail; next tick might work
      const data = await res.json();
      const details = data?.items?.[0]?.liveStreamingDetails;

      const isLive =
        !!details?.concurrentViewers ||
        (!!details?.actualStartTime && !details?.actualEndTime);

      const hasEnded = !!details?.actualEndTime;

      // Update state + UI immediately
      stateRef.isLive = isLive;
      stateRef.hasEnded = hasEnded;
      updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, stateRef.isLive, stateRef.hasEnded);

      if (hasEnded) {
        clearInterval(timer);
      }
    } catch (e) {
      // swallow errors; try again next tick
      // console.error(e);
    }
  };

  // initial poll, then every 60s
  poll();
  const timer = setInterval(poll, 60_000);
}

/* =======================
   RENDER
======================= */
function renderStream({ videoId, title, description, startTime, isLiveInitial }) {
  const container = document.getElementById("output");

  // Force high-res 16:9 thumbnails with responsive sources
  const src320 = `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;       // 320×180
  const src1280 = `https://i.ytimg.com/vi/${videoId}/hq720.jpg`;          // 1280×720
  const src1920 = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;  // 1920×1080 if available (fallback 1280)

  const imgHTML = `
    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">
      <img
        src="${src1280}"
        srcset="
          ${src320} 320w,
          ${src1280} 1280w,
          ${src1920} 1920w
        "
        sizes="(max-width: 640px) 100vw, 640px"
        alt=""
        loading="lazy"
      />
    </a>
  `;

  container.innerHTML = `
    <div class="stream">
      ${imgHTML}
      <div class="content">
        <div class="title">${title}</div>
        <div class="date">${formatUKDate(startTime)} (UK time)</div>
        <div class="countdown" id="countdown"></div>
        <div class="description">${truncate(description, DESCRIPTION_LIMIT)}</div>
        <div class="calendar" id="calendar">
          ${calendarLinks(title, startTime, videoId)}
        </div>
        <div class="watch-live" id="watchLive" style="display:none">
          <a href="https://www.youtube.com/watch?v=${videoId}&live_chat=1" target="_blank" rel="noopener">
            ▶ Watch live on YouTube
          </a>
        </div>
      </div>
    </div>
  `;

  const countdownEl = document.getElementById("countdown");
  const calendarEl = document.getElementById("calendar");
  const watchLiveEl = document.getElementById("watchLive");

  // Keep live status in a small mutable ref, so countdown + poll can update in sync
  const stateRef = { isLive: !!isLiveInitial, hasEnded: false };

  // Start countdown ticks (minute-by-minute)
  startCountdown(startTime, countdownEl, calendarEl, watchLiveEl, stateRef);

  // Begin live monitor shortly before start (or immediately if already live)
  startLiveMonitor(videoId, stateRef, countdownEl, calendarEl, watchLiveEl, startTime);
}

/* =======================
   LOAD STREAM
======================= */
async function loadNextLivestream() {
  if (TEST_MODE) {
    const start = new Date(Date.now() + 10 * 60000).toISOString();
    renderStream({
      videoId: "TEST123",
      title: "Test Livestream (Dev Mode)",
      description: "This is a mock livestream used for development and layout testing.",
      startTime: start,
      isLiveInitial: false
    });
    return;
  }

  try {
    // 1) Get up to 50 upcoming items (most recently published) then sort client-side by scheduledStartTime
    const searchUrl =
      "https://www.googleapis.com/youtube/v3/search" +
      `?part=snippet` +
      `&channelId=${CHANNEL_ID}` +
      `&eventType=upcoming` +
      `&type=video` +
      `&order=date` +     // per your preference: "50 most recently published" is enough
      `&maxResults=50` +
      `&key=${API_KEY}`;

    const searchRes = await fetch(searchUrl);
    if (!searchRes.ok) throw new Error(`Search error: ${searchRes.status}`);
    const searchData = await searchRes.json();

    if (!searchData.items || searchData.items.length === 0) {
      document.getElementById("output").innerHTML =
        `<p class="none">No upcoming events are currently scheduled. Check back soon - new events are added all the time.</p>`;
      return;
    }

    const ids = searchData.items.map(i => i?.id?.videoId).filter(Boolean);
    if (ids.length === 0) {
      document.getElementById("output").innerHTML =
        `<p class="none">No upcoming events are currently scheduled. Check back soon - new events are added all the time.</p>`;
      return;
    }

    // 2) Fetch full details for sorting and status
    const videoUrl =
      "https://www.googleapis.com/youtube/v3/videos" +
      `?part=snippet,status,liveStreamingDetails` +
      `&id=${ids.join(",")}` +
      `&key=${API_KEY}`;

    const videoRes = await fetch(videoUrl);
    if (!videoRes.ok) throw new Error(`Videos error: ${videoRes.status}`);
    const videoData = await videoRes.json();

    // 3) Build candidate list
    const nowISO = new Date().toISOString();
    const candidates = (videoData.items || [])
      .filter(v => v?.status?.privacyStatus === "public")
      .map(v => {
        const lsd = v.liveStreamingDetails || {};
        return {
          raw: v,
          videoId: v.id,
          title: v.snippet?.title ?? "",
          description: v.snippet?.description ?? "",
          scheduledStartTime: lsd?.scheduledStartTime || null,
          actualStartTime: lsd?.actualStartTime || null,
          actualEndTime: lsd?.actualEndTime || null,
          isLiveInitial: !!lsd?.concurrentViewers // present if currently live
        };
      })
      .filter(v => !!v.scheduledStartTime);

    if (candidates.length === 0) {
      document.getElementById("output").innerHTML =
        `<p class="none">No upcoming events are currently scheduled. Check back soon - new events are added all the time.</p>`;
      return;
    }

    // 4) Only consider events scheduled for now or the future (safety guard)
    const upcoming = candidates
      .filter(v => v.scheduledStartTime >= nowISO)
      .sort((a, b) => new Date(a.scheduledStartTime) - new Date(b.scheduledStartTime));

    // Fallback: if none are >= now (rare for 'upcoming'), pick earliest scheduled anyway
    const pick = upcoming[0] ||
      candidates.sort((a, b) => new Date(a.scheduledStartTime) - new Date(b.scheduledStartTime))[0];

    renderStream({
      videoId: pick.videoId,
      title: pick.title,
      description: pick.description,
      startTime: pick.scheduledStartTime,
      isLiveInitial: pick.isLiveInitial
    });

  } catch (err) {
    console.error(err);
    document.getElementById("output").innerHTML =
      `<p class="none">Sorry, we couldn’t load the next livestream right now.</p>`;
  }
}

loadNextLivestream();
</script>

</body>
</html>
