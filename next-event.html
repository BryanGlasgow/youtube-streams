<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Next Livestream</title>

<!-- PT Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #ffffff;
  }
  .container { max-width: 640px; margin: 0 auto; }
  .stream { border: 1px solid #ddd; border-radius: 4px; overflow: hidden; background: #fff; }
  .stream img { width: 100%; display: block; }
  .content { padding: 0.75rem; }
  .title { font-weight: bold; margin-bottom: 0.25rem; }
  .date { font-size: 0.9rem; color: #555; }
  .countdown { margin-top: 0.25rem; font-size: 0.95rem; font-weight: bold; color: #333; }
  .live { color: #cc0000; }
  .description { margin-top: 0.5rem; font-size: 0.9rem; color: #000; }
  .calendar { margin-top: 0.5rem; font-size: 0.85rem; }
  .calendar a { margin-right: 0.75rem; text-decoration: none; color: #005398; }
  .calendar a:hover { text-decoration: underline; }
  .watch-live { margin-top: 0.75rem; }
  .watch-live a {
    display: inline-block;
    background: #cc0000;
    color: #fff;
    padding: 0.5rem 0.75rem;
    text-decoration: none;
    font-weight: bold;
    border-radius: 3px;
  }
  .watch-live a:hover { background: #a30000; }
  .none { font-style: italic; color: #666; }
</style>
</head>

<body>

<div class="container" id="output">
  Loading next livestream…
</div>

<script>
/* =======================
   CONFIG
======================= */
const API_KEY = "AIzaSyDvflaf2WrXoTPnj1-cDHYWhCD_pMJnhoY";
const CHANNEL_ID = "UC7Do00lxLh7l4WwXLl96P5A";
const TIMEZONE = "Europe/London";
const DESCRIPTION_LIMIT = 200;

/* DEV MODE */
const TEST_MODE = false;

/* =======================
   UTILITIES
======================= */
function formatUKDate(iso) {
  return new Date(iso).toLocaleString("en-GB", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: TIMEZONE
  });
}

function truncate(text, max) {
  if (!text) return "";
  return text.length > max ? text.substring(0, max) + "…" : text;
}

/* Calendar links unchanged… */

function calendarLinks(title, startISO, videoId) {
  const start = new Date(startISO);
  const end = new Date(start.getTime() + 60 * 60 * 1000);

  const formatICS = d =>
    d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

  const ics = `
BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${formatICS(start)}
DTEND:${formatICS(end)}
SUMMARY:${title}
URL:https://www.youtube.com/watch?v=${videoId}
END:VEVENT
END:VCALENDAR`.trim();

  const icsBlob = new Blob([ics], { type: "text/calendar" });
  const icsUrl = URL.createObjectURL(icsBlob);

  const google =
    "https://www.google.com/calendar/render?action=TEMPLATE" +
    `&text=${encodeURIComponent(title)}` +
    `&dates=${formatICS(start)}/${formatICS(end)}` +
    `&details=${encodeURIComponent("Watch on YouTube")}` +
    `&location=${encodeURIComponent("YouTube")}`;

  return `
    <a href="${google}" target="_blank">Add to Google Calendar</a>
    <a href="${icsUrl}" download="livestream.ics">Add to Outlook / Apple Calendar</a>
    <a href="https://www.youtube.com/channel/${CHANNEL_ID}?sub_confirmation=1">Subscribe</a>
  `;
}

/* =======================
   COUNTDOWN + LIVE LOGIC
======================= */

/* UPDATED: accepts isLive flag */
function updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, isLive) {

  if (isLive) {
    countdownEl.textContent = "LIVE NOW";
    countdownEl.classList.add("live");
    calendarEl.style.display = "none";
    watchLiveEl.style.display = "block";
    return;
  }

  const now = new Date();
  const start = new Date(startISO);
  const diff = start - now;

  if (diff <= 0) {
    countdownEl.textContent = "Starting…";
    countdownEl.classList.add("live");
    return;
  }

  const mins = Math.floor(diff / 60000);
  const hrs = Math.floor(mins / 60);
  const days = Math.floor(hrs / 24);

  let text;
  if (days > 0) text = `Starts in ${days} day${days !== 1 ? "s" : ""}`;
  else if (hrs > 0) text = `Starts in ${hrs} hour${hrs !== 1 ? "s" : ""}`;
  else text = `Starts in ${mins} minute${mins !== 1 ? "s" : ""}`;

  countdownEl.textContent = text;
}

function startCountdown(startISO, countdownEl, calendarEl, watchLiveEl, isLive) {
  updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, isLive);
  setInterval(() => {
    updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, isLive);
  }, 60000);
}

/* =======================
   RENDER
======================= */
function renderStream({ videoId, title, description, thumbnail, startTime, isLive }) {
  const container = document.getElementById("output");

  container.innerHTML = `
    <div class="stream">
      <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">
        <img src="${thumbnail}" alt="">
      </a>

      <div class="content">
        <div class="title">${title}</div>
        <div class="date">${formatUKDate(startTime)} (UK time)</div>

        <div class="countdown" id="countdown"></div>

        <div class="description">${truncate(description, DESCRIPTION_LIMIT)}</div>

        <div class="calendar" id="calendar">
          ${calendarLinks(title, startTime, videoId)}
        </div>

        <div class="watch-live" id="watchLive" style="display:none">
          <a href="https://www.youtube.com/watch?v=${videoId}&live_chat=1" target="_blank">
            ▶ Watch live on YouTube
          </a>
        </div>
      </div>
    </div>
  `;

  startCountdown(
    startTime,
    document.getElementById("countdown"),
    document.getElementById("calendar"),
    document.getElementById("watchLive"),
    isLive
  );
}

/* =======================
   LOAD NEXT STREAM (FIXED)
======================= */
async function loadNextLivestream() {
  if (TEST_MODE) {
    const start = new Date(Date.now() + 10 * 60000).toISOString();
    renderStream({
      videoId: "TEST123",
      title: "Test Livestream",
      description: "Development mock stream.",
      thumbnail: "https://i.ytimg.com/vi/lVL8gN_APZ0/hqdefault.jpg?sqp=-oaymwEnCNACELwBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLDWnQfwej2fiyMnKagzSn1vDHm9rQ",
      startTime: start,
      isLive: false
    });
    return;
  }

  try {
    /* 1) FETCH up to 50 UPCOMING scheduled events */
    const searchUrl =
      "https://www.googleapis.com/youtube/v3/search" +
      `?part=snippet` +
      `&channelId=${CHANNEL_ID}` +
      `&eventType=upcoming` +
      `&type=video` +
      `&maxResults=50` +
      `&key=${API_KEY}`;

    const sr = await fetch(searchUrl);
    const sd = await sr.json();

    if (!sd.items || sd.items.length === 0) {
      document.getElementById("output").innerHTML =
        `<p class="none">No upcoming events currently scheduled.</p>`;
      return;
    }

    const ids = sd.items.map(i => i.id.videoId).filter(Boolean);

    /* 2) FETCH full details */
    const detailsUrl =
      "https://www.googleapis.com/youtube/v3/videos" +
      `?part=snippet,status,liveStreamingDetails` +
      `&id=${ids.join(",")}` +
      `&key=${API_KEY}`;

    const vr = await fetch(detailsUrl);
    const vd = await vr.json();

    const now = new Date();

    const candidates = vd.items
      .map(v => {
        const sched = v.liveStreamingDetails?.scheduledStartTime;
        return sched ? {
          videoId: v.id,
          title: v.snippet.title,
          description: v.snippet.description,
          thumbnail: (
            v.snippet.thumbnails.medium?.url ||
            v.snippet.thumbnails.high?.url ||
            v.snippet.thumbnails.default?.url
          ),
          startTime: sched,
          isLive: !!v.liveStreamingDetails?.concurrentViewers
        } : null;
      })
      .filter(Boolean);

    if (candidates.length === 0) {
      document.getElementById("output").innerHTML =
        `<p class="none">No upcoming livestreams scheduled.</p>`;
      return;
    }

    /* 3) PICK earliest scheduled stream */
    candidates.sort(
      (a, b) => new Date(a.startTime) - new Date(b.startTime)
    );

    const next = candidates[0];

    renderStream(next);

  } catch (e) {
    console.error(e);
    document.getElementById("output").innerHTML =
      `<p class="none">Unable to load livestream information.</p>`;
  }
}

loadNextLivestream();
</script>

</body>
</html>
