<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YouTube Video Details</title>

<!-- PT Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #ffffff;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  .stream {
    /* Removed border + rounded corners (Option B) */
    border: none;
    border-radius: 0;
    overflow: hidden;
    background: #ffffff;
  }

  .stream img {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;      /* no letterboxing */
    object-position: center;
  }

  .content {
    padding: 0.75rem;
  }

  .title {
    font-weight: bold;
    margin-bottom: 0.25rem;
  }

  .date {
    font-size: 0.9rem;
    color: #555;
  }

  .countdown {
    margin-top: 0.25rem;
    font-size: 0.95rem;
    font-weight: bold;
    color: #333;
  }

  .live {
    color: #cc0000;
  }

  /* Prominent "Watch on YouTube" button (Option A) */
  .watch-yt {
    margin-top: 0.75rem;
  }
  .watch-yt .yt-button {
    display: inline-block;
    background: #cc0000;
    color: #fff;
    padding: 0.6rem 0.9rem;
    text-decoration: none;
    font-weight: bold;
    border-radius: 4px;
    font-size: 1rem;
  }
  .watch-yt .yt-button:hover {
    background: #a30000;
  }

  .description {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #000000;
    white-space: pre-wrap;  /* preserve line breaks like YouTube */
  }
  .description a {
    color: #005398;
    text-decoration: none;
    word-break: break-word;
  }
  .description a:hover {
    text-decoration: underline;
  }

  .calendar {
    margin-top: 0.5rem;
    font-size: 0.85rem;
  }
  .calendar a {
    margin-right: 0.75rem;
    text-decoration: none;
    color: #005398;
  }
  .calendar a:hover { text-decoration: underline; }

  .watch-live {
    margin-top: 0.75rem;
  }
  .watch-live a {
    display: inline-block;
    background: #cc0000;
    color: #fff;
    padding: 0.5rem 0.75rem;
    text-decoration: none;
    font-weight: bold;
    border-radius: 3px;
  }
  .watch-live a:hover { background: #a30000; }

  .none {
    font-style: italic;
    color: #666;
  }
</style>
</head>

<body>

<div class="container" id="output">
  Loading video…
</div>

<script>
/* =======================
   CONFIG
======================= */
const API_KEY = "AIzaSyDvflaf2WrXoTPnj1-cDHYWhCD_pMJnhoY"; // <-- Put your actual YouTube Data API v3 key here
const TIMEZONE = "Europe/London";

/* =======================
   URL PARAM PARSER
   - supports ?video=ID or full YouTube URLs
======================= */
function getVideoIdFromQuery() {
  const p = new URLSearchParams(window.location.search);
  let v = p.get("video");
  if (!v) return null;
  v = v.trim();

  // Accept full YouTube URLs too
  if (v.includes("youtube.com") || v.includes("youtu.be")) {
    try {
      const url = new URL(v);
      if (url.hostname.includes("youtu.be")) {
        const id = url.pathname.replace("/", "").trim();
        if (id) return id;
      }
      const idParam = url.searchParams.get("v");
      if (idParam) return idParam.trim();
      // Fallback for other path styles
      const parts = url.pathname.split("/").filter(Boolean);
      if (parts.length) return parts[parts.length - 1];
    } catch {}
  }
  return v;
}

/* =======================
   UTILITIES
======================= */
function formatUKDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-GB", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: TIMEZONE
  });
}

/* Calendar generator */
function calendarLinks(title, startISO, videoId) {
  const start = new Date(startISO);
  const end = new Date(start.getTime() + 60 * 60 * 1000);

  const formatICS = d =>
    d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

  const ics = `
BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${formatICS(start)}
DTEND:${formatICS(end)}
SUMMARY:${title}
URL:https://www.youtube.com/watch?v=${videoId}
END:VEVENT
END:VCALENDAR`.trim();

  const icsBlob = new Blob([ics], { type: "text/calendar" });
  const icsUrl = URL.createObjectURL(icsBlob);

  const google =
    "https://www.google.com/calendar/render?action=TEMPLATE" +
    `&text=${encodeURIComponent(title)}` +
    `&dates=${formatICS(start)}/${formatICS(end)}` +
    `&details=${encodeURIComponent("Watch on YouTube")}` +
    `&location=${encodeURIComponent("YouTube")}`;

  return `
    <a href="${google}" target="_blank" rel="noopener">Add to Google Calendar</a>
    <a href="${icsUrl}" download="livestream.ics">Add to Outlook / Apple Calendar</a>
    <a href="https://www.youtube.com/channel/UC7Do00lxLh7l4WwXLl96P5A?sub_confirmation=1" target="_blank" rel="noopener">Subscribe</a>
  `;
}

/* =======================
   LINKIFY (URLs, timestamps, hashtags, @mentions)
   Safe: start from plain text (escaped), then only insert <a> elements.
======================= */
function linkifyDescription(rawText, videoId) {
  const container = document.createElement('div');
  container.textContent = rawText || "";

  // Replace in TEXT nodes only
  function replaceInTextNodes(root, regex, builder) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);

    nodes.forEach(node => {
      const text = node.nodeValue;
      let lastIndex = 0;
      let m;
      const frag = document.createDocumentFragment();

      regex.lastIndex = 0;
      while ((m = regex.exec(text)) !== null) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
        builder(frag, m);
        lastIndex = regex.lastIndex;
        if (m.index === regex.lastIndex) regex.lastIndex++; // guard
      }
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  // 1) URLs (http/https/www.)
  const urlRegex = /((https?:\/\/)[^\s<]+)|(www\.[^\s<]+)/gi;
  replaceInTextNodes(container, urlRegex, (frag, m) => {
    const url = m[1] || m[3];
    const href = url.startsWith('http') ? url : 'https://' + url;
    const a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer nofollow';
    a.textContent = url;
    frag.appendChild(a);
  });

  // 2) Timestamps mm:ss or hh:mm:ss
  const tsRegex = /(^|[\s(])(\d{1,2}):([0-5]\d)(?::([0-5]\d))?\b/g;
  replaceInTextNodes(container, tsRegex, (frag, m) => {
    const prefix = m[1] || '';
    if (prefix) frag.appendChild(document.createTextNode(prefix));

    let seconds = 0;
    if (m[4] !== undefined) {
      const h = parseInt(m[2], 10);
      const mm = parseInt(m[3], 10);
      const ss = parseInt(m[4], 10);
      seconds = h * 3600 + mm * 60 + ss;
    } else {
      const mm = parseInt(m[2], 10);
      const ss = parseInt(m[3], 10);
      seconds = mm * 60 + ss;
    }

    const a = document.createElement('a');
    const label = m[0].slice(prefix.length);
    a.href = `https://www.youtube.com/watch?v=${videoId}&t=${seconds}s`;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = label;
    frag.appendChild(a);
  });

  // 3) Hashtags #Topic
  const hashRegex = /(^|[\s(])#([A-Za-z0-9_]+)\b/g;
  replaceInTextNodes(container, hashRegex, (frag, m) => {
    const prefix = m[1] || '';
    if (prefix) frag.appendChild(document.createTextNode(prefix));
    const tag = m[2];
    const a = document.createElement('a');
    a.href = `https://www.youtube.com/hashtag/${tag.toLowerCase()}`;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '#' + tag;
    frag.appendChild(a);
  });

  // 4) Mentions @handle
  const atRegex = /(^|[\s(])@([A-Za-z0-9._-]{3,})\b/g;
  replaceInTextNodes(container, atRegex, (frag, m) => {
    const prefix = m[1] || '';
    if (prefix) frag.appendChild(document.createTextNode(prefix));
    const handle = m[2];
    const a = document.createElement('a');
    a.href = `https://www.youtube.com/@${handle}`;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '@' + handle;
    frag.appendChild(a);
  });

  return container.innerHTML;
}

/* =======================
   LIVE STATUS + COUNTDOWN
======================= */
function updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, isLive, hasEnded) {
  if (!startISO) {
    countdownEl.textContent = "";
    return;
  }

  if (hasEnded) {
    countdownEl.textContent = "Stream ended";
    watchLiveEl.style.display = "none";
    calendarEl.style.display = "none";
    return;
  }

  if (isLive) {
    countdownEl.textContent = "LIVE NOW";
    countdownEl.classList.add("live");
    calendarEl.style.display = "none";
    watchLiveEl.style.display = "block";
    return;
  }

  const now = new Date();
  const start = new Date(startISO);
  const diff = start - now;

  if (diff <= 0) {
    countdownEl.textContent = "Starting…";
    countdownEl.classList.add("live");
    return;
  }

  const mins = Math.floor(diff / 60000);
  const hrs = Math.floor(mins / 60);
  const days = Math.floor(hrs / 24);

  let t = "";
  if (days > 0) t = `Starts in ${days} day${days !== 1 ? "s" : ""}`;
  else if (hrs > 0) t = `Starts in ${hrs} hour${hrs !== 1 ? "s" : ""}`;
  else t = `Starts in ${mins} minute${mins !== 1 ? "s" : ""}`;

  countdownEl.textContent = t;
}

function startCountdown(startISO, countdownEl, calendarEl, watchLiveEl, stateRef) {
  updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, stateRef.isLive, stateRef.hasEnded);
  const id = setInterval(() => {
    updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, stateRef.isLive, stateRef.hasEnded);
    if (stateRef.hasEnded) clearInterval(id);
  }, 60000);
}

function startLiveMonitor(videoId, stateRef, countdownEl, calendarEl, watchLiveEl, startISO) {
  if (!startISO) return;

  const shouldMonitor = () => {
    if (stateRef.hasEnded) return false;
    if (stateRef.isLive) return true;
    const diff = new Date(startISO) - new Date();
    return diff <= 900000; // 15 minutes before start
  };

  if (!shouldMonitor()) return;

  const poll = async () => {
    try {
      const url =
        "https://www.googleapis.com/youtube/v3/videos" +
        `?part=liveStreamingDetails` +
        `&id=${videoId}` +
        `&key=${API_KEY}`;

      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      const lsd = data.items?.[0]?.liveStreamingDetails || {};

      const live = !!lsd.concurrentViewers || (!!lsd.actualStartTime && !lsd.actualEndTime);
      const ended = !!lsd.actualEndTime;

      stateRef.isLive = live;
      stateRef.hasEnded = ended;

      updateStatus(startISO, countdownEl, calendarEl, watchLiveEl, live, ended);
      if (ended) clearInterval(timer);
    } catch {}
  };

  poll();
  const timer = setInterval(poll, 60000);
}

/* =======================
   IMAGE FALLBACK (maxres -> hq720 -> apiThumb)
======================= */
function imgFallback(img) {
  // If maxres fails, try hq720, then apiThumb.
  if (!img.dataset.fallbackTried1) {
    img.dataset.fallbackTried1 = "1";
    img.src = img.dataset.fallback1; // hq720
  } else if (!img.dataset.fallbackTried2) {
    img.dataset.fallbackTried2 = "1";
    img.src = img.dataset.fallback2; // apiThumb
  } else {
    // Give up silently; at least apiThumb was attempted
  }
}

/* =======================
   RENDER VIDEO
======================= */
function renderVideo(v) {
  const container = document.getElementById("output");

  const {
    videoId,
    title,
    description,
    publishedAt,
    scheduledStartTime,
    actualStartTime,
    actualEndTime,
    isLiveInitial,
    apiThumb /* always present from API thumbnails */
  } = v;

  const hasLiveData = !!scheduledStartTime || !!actualStartTime || !!actualEndTime;

  // Linkified description
  const linkedDescription = linkifyDescription(description, videoId);

  // Thumbnail sources
  const maxres = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
  const hq720  = `https://i.ytimg.com/vi/${videoId}/hq720.jpg`;

  container.innerHTML = `
    <div class="stream">
      <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">
        <img
          src="${maxres}"
          data-fallback1="${hq720}"
          data-fallback2="${apiThumb}"
          onerror="imgFallback(this)"
          alt="${title.replace(/"/g, '&quot;')}"
        >
      </a>

      <div class="content">
        <div class="title">${title}</div>

        <div class="date">
          ${
            hasLiveData
              ? `${formatUKDate(scheduledStartTime || actualStartTime)} (UK time)`
              : `Published on ${formatUKDate(publishedAt)}`
          }
        </div>

        <div class="countdown" id="countdown"></div>

        <!-- Prominent Watch on YouTube button (Option A, bottom above description) -->
        <div class="watch-yt">
          <a class="yt-button" href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">
            ▶ Watch on YouTube
          </a>
        </div>

        <!-- Full description (no truncation) with linkifying -->
        <div class="description" id="desc">
          ${linkedDescription}
        </div>

        <div class="calendar" id="calendar" style="${hasLiveData ? "" : "display:none"}">
          ${scheduledStartTime ? calendarLinks(title, scheduledStartTime, videoId) : ""}
        </div>

        <div class="watch-live" id="watchLive" style="display:none">
          <a href="https://www.youtube.com/watch?v=${videoId}&live_chat=1" target="_blank" rel="noopener">
            ▶ Watch live on YouTube
          </a>
        </div>
      </div>
    </div>
  `;

  const countdownEl = document.getElementById("countdown");
  const calendarEl = document.getElementById("calendar");
  const watchLiveEl = document.getElementById("watchLive");

  const stateRef = { isLive: isLiveInitial, hasEnded: !!actualEndTime };

  if (hasLiveData) {
    startCountdown(scheduledStartTime, countdownEl, calendarEl, watchLiveEl, stateRef);
    startLiveMonitor(videoId, stateRef, countdownEl, calendarEl, watchLiveEl, scheduledStartTime);
  }
}

/* =======================
   LOAD VIDEO
======================= */
async function loadVideo() {
  const videoId = getVideoIdFromQuery();
  const out = document.getElementById("output");

  if (!videoId) {
    out.innerHTML = `<p class="none">No video ID supplied inStreamingDetails || {};
    const thumbs = v.snippet?.thumbnails || {};

    // API-provided thumbnail fallback that always exists
    const apiThumb =
      thumbs.maxres?.url ||
      thumbs.standard?.url ||
      thumbs.high?.url ||
      thumbs.medium?.url ||
      thumbs.default?.url ||
      "";

    const mapped = {
      videoId,
      title: v.snippet.title,
      description: v.snippet.description,
      publishedAt: v.snippet.publishedAt,
      scheduledStartTime: lsd.scheduledStartTime || null,
      actualStartTime: lsd.actualStartTime || null,
      actualEndTime: lsd.actualEndTime || null,
      isLiveInitial: !!lsd.concurrentViewers,
      apiThumb
    };

    renderVideo(mapped);

  } catch (err) {
    console.error(err);
    out.innerHTML = `<p class="none">Unable to load video details.</p>`;
  }
}

loadVideo();
</script>

</body>
</html>
