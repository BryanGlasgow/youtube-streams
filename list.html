<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Livestreams List</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- PT Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: light; }
  body { margin:0; background:#fff; font-family:'PT Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  .wrap { padding: 1rem; }

  h3 { margin: 1.25rem 0 .5rem; font-size:1.25rem; }
  .stream-list {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:1rem;
    margin-bottom: 1rem;
  }
  .stream-card {
    border:1px solid #ddd; border-radius:4px; overflow:hidden;
    display:block; text-decoration:none; color:#000; background:#fafafa;
  }
  .thumb { width:100%; display:block; }
  .stream-card-content { padding:.75rem; }
  .stream-card-title { font-weight:700; margin-bottom:.25rem; }
  .stream-card-date { font-size:.85rem; color:#555; }

  /* Compact CTA row under upcoming cards */
  .cta-row {
    display:flex; align-items:center; gap:.75rem;
    padding:.5rem .75rem .75rem; /* a bit tighter */
  }
  .cta-row a {
    display:inline-block; font-size:.85rem; color:#005398; text-decoration:none;
  }
  .cta-row a:hover { text-decoration:underline; }
  .cta-sep { color:#bbb; }

  .message { color:#555; padding:.5rem 0; }

.youtube-btn {
    display: inline-block;
    padding: 10px 18px;
    background-color: #011451;
    color: white;
    text-decoration: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: 600;
    border-radius: 4px;
    transition: background-color 0.25s ease;
}

.youtube-btn:hover {
    background-color: #002060;
}
  
</style>
</head>
<body>
  <div class="wrap">

  <!-- *** COMMENTED OUT IF NO UPCOMING EVENTS ***
    <h3>Upcoming Events</h3>
    <p>Connect with the postgraduate degrees that interest you through our upcoming live events. Meet our expert academics and current students, and ask them your questions about postgraduate life and study in Glasgow. 
Choose an event and click "Notify me" to get a reminder when it goes live.
</p>
    <div id="upcoming" class="stream-list"></div>

    -->

    <h3>Recent Events</h3>
    <p>Catch up with the recordings of our live panel discussion and Q&A events. Hear from our current students as they share their experiences of postgraduate study, and answer viewer questions.
It’s a great way to learn more about our postgraduate degrees in Arts & Humanities.  
</p>
    <div id="past" class="stream-list"></div>
  </div>

  <!-- Shared data layer -->
  <script src="./yt-shared.js"></script>

  <script>
    const TIMEZONE = "Europe/London";

    function formatUKDate(iso) {
      return new Date(iso).toLocaleString("en-GB", {
        dateStyle:"medium", timeStyle:"short", timeZone: TIMEZONE
      });
    }

    /* ---- Calendar helpers (Google + ICS) ---- */
    function toIcsStamp(d) {
      // UTC Zulu, strip milliseconds & separators per iCalendar
      return new Date(d).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    }

    function buildCalendarCta(container, title, startISO, videoId) {
      const start = new Date(startISO);
      const end   = new Date(start.getTime() + 60 * 60 * 1000);

      // Google Calendar URL
      const gURL =
        "https://www.google.com/calendar/render?action=TEMPLATE" +
        `&text=${encodeURIComponent(title)}` +
        `&dates=${toIcsStamp(start)}/${toIcsStamp(end)}` +
        `&details=${encodeURIComponent("Watch on YouTube")}` +
        `&location=${encodeURIComponent("YouTube")}`;

      // ICS (Outlook / Apple) – generate a Blob so download works cleanly
      const ics =
`BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART:${toIcsStamp(start)}
DTEND:${toIcsStamp(end)}
SUMMARY:${title}
URL:https://www.youtube.com/watch?v=${videoId}
END:VEVENT
END:VCALENDAR`;
      const icsBlob = new Blob([ics], { type: "text/calendar" });
      const icsURL  = URL.createObjectURL(icsBlob);

      const row = document.createElement("div");
      row.className = "cta-row";

      const aGoogle = document.createElement("a");
      aGoogle.href = gURL;
      aGoogle.target = "_blank";
      aGoogle.rel = "noopener";
      aGoogle.textContent = "Add to Google Calendar";

      const sep = document.createElement("span");
      sep.className = "cta-sep";
      sep.textContent = "•";

      const aIcs = document.createElement("a");
      aIcs.href = icsURL;
      aIcs.download = "livestream.ics";
      aIcs.textContent = "Download ICS";

      row.appendChild(aGoogle);
      row.appendChild(sep);
      row.appendChild(aIcs);

      container.appendChild(row);
    }

    /* ---- Card renderers ---- */

    // Base card for either upcoming or past; pass addCalendar=true for upcoming
    function card(v, dateIso, addCalendar=false) {
      const id    = v.id;
      const title = v.title;
      const t     = v.thumbnails || {};
      const thumb = (t.medium && t.medium.url)
        || (t.high && t.high.url)
        || (t.default && t.default.url)
        || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

      // Card root (link wraps thumbnail only; content remains clickable text)
      const card = document.createElement("div");
      card.className = "stream-card";

      const link = document.createElement("a");
      link.href = `https://www.youtube.com/watch?v=${id}`;
      link.target = "_blank";
      link.rel = "noopener";

      const img = document.createElement("img");
      img.className = "thumb";
      img.src = thumb;
      img.alt = "";
      link.appendChild(img);
      card.appendChild(link);

      const content = document.createElement("div");
      content.className = "stream-card-content";
      content.innerHTML = `
        <div class="stream-card-title">${title}</div>
        <div class="stream-card-date">${formatUKDate(dateIso)}</div>
      `;
      card.appendChild(content);

      if (addCalendar) {
        // Compact calendar CTA sits under the content block
        buildCalendarCta(card, title, dateIso, id);
      }

      return card;
    }

    /* ---- Page rendering ---- */
    function renderLists(data) {
      const upEl = document.getElementById("upcoming");
      const psEl = document.getElementById("past");
      upEl.innerHTML = ""; psEl.innerHTML = "";

      if (!data.upcoming || !data.upcoming.length) {
        upEl.innerHTML = `<div class="message">We regularly add new events. Please check back soon.</div>`;
      } else {
        data.upcoming.forEach(v => {
          // Upcoming: show calendar CTA; date = scheduled start
          upEl.appendChild(card(v, v.scheduledStartTime, true));
        });
      }

      if (!data.past || !data.past.length) {
        psEl.innerHTML = `<div class="message">No previous events found.</div>`;
      } else {
        data.past.forEach(v => {
          // Past: no calendar CTA; date = actual start (fallback scheduled)
          psEl.appendChild(card(v, v.actualStartTime || v.scheduledStartTime, false));
        });
      }
    }

    YTShared.getSharedData()
      .then(renderLists)
.catch(() => {
  document.getElementById("upcoming").innerHTML = `
    <a class="youtube-btn" 
       href="https://www.youtube.com/playlist?list=PLchy_nZQAZtAIkcBQ3sMEQgLfoF48-FiV">
      <strong>See the Full Playlist on YouTube ></strong>
    </a>
  `;

  document.getElementById("past").innerHTML = "";
});
  </script>
</body>
</html>
